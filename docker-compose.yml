services:
  mongo:
    image: mongo:9
    container_name: favoritos-mongo
    restart: unless-stopped
    ports:
      # Solo en este equipo: MongoDB no tiene usuario ni contraseña.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    image: api-restful-favoritos
    container_name: favoritos-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # "mongo" es el nombre del servicio dentro de la red de Docker.
      MONGODB_URI: mongodb://mongo:27017/bookmarks
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      # Confía en X-Forwarded-For solo si la petición llega desde la red privada de Docker
      # (el nginx del frontend o el puerto publicado en 127.0.0.1).
      TRUST_PROXY: uniquelocal
    ports:
      # Solo en este equipo: la API no tiene autenticación.
      - '127.0.0.1:5000:5000'

volumes:
  mongo-data:
    # Nombre fijo para compartir los datos cuando el frontend incluye este archivo
    # (Compose le pondría el prefijo de ese otro proyecto).
    name: api-restful-favoritos_mongo-data
