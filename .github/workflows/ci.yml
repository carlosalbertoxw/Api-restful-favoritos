name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Pruebas unitarias (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Pruebas de integración y cobertura
    runs-on: ubuntu-latest
    needs: unit
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/bookmarks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias + integración con umbral de cobertura
        run: npm run test:coverage

  docker:
    name: Imagen Docker y prueba de humo
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Construir y levantar API + MongoDB (espera a los healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Readiness responde 200
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors http://localhost:5000/health/ready

      - name: Prueba de humo del CRUD
        run: |
          set -euo pipefail
          id=$(curl --fail -sS -X POST http://localhost:5000/api/favorito \
            -H 'Content-Type: application/json' \
            -d '{"title":"Docker","url":"https://docker.com"}' | jq -r '.favorito.id')
          curl --fail -sS "http://localhost:5000/api/favorito/$id" | jq -e '.favorito.title == "Docker"'
          curl --fail -sS -X DELETE "http://localhost:5000/api/favorito/$id"
          status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5000/api/favorito/$id")
          test "$status" = 404

      - name: La API corre sin privilegios de root
        run: test "$(docker compose exec -T api id -u)" != "0"

      - name: Logs de los contenedores
        if: failure()
        run: docker compose ps && docker compose logs

      - name: Detener contenedores
        if: always()
        run: docker compose down -v

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=moderate
