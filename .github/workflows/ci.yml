name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Pruebas unitarias (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Pruebas de integración y cobertura
    runs-on: ubuntu-latest
    needs: unit
    services:
      mongo:
        image: mongo:9
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/bookmarks_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias + integración con umbral de cobertura
        run: npm run test:coverage

  docker:
    name: Imagen Docker y prueba de humo
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - name: Construir y levantar API + MongoDB (espera a los healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Readiness responde 200
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors http://localhost:5000/health/ready

      - name: Prueba de humo del CRUD
        run: |
          set -euo pipefail
          id=$(curl --fail -sS -X POST http://localhost:5000/api/v1/bookmarks \
            -H 'Content-Type: application/json' \
            -d '{"title":"Docker","url":"https://docker.com"}' | jq -r '.bookmark.id')
          curl --fail -sS "http://localhost:5000/api/v1/bookmarks/$id" | jq -e '.bookmark.title == "Docker"'
          curl --fail -sS "http://localhost:5000/api/v1/bookmarks" | jq -e '.hasMore == false'
          curl --fail -sS -X DELETE "http://localhost:5000/api/v1/bookmarks/$id"
          status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5000/api/v1/bookmarks/$id")
          test "$status" = 404

      - name: La API corre sin privilegios de root
        run: test "$(docker compose exec -T api id -u)" != "0"

      - name: Escanear la imagen con Trivy (vulnerabilidades altas o críticas con parche)
        # Fijada por el SHA del commit de v0.36.0: una etiqueta movida no cambia lo que se ejecuta.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api-restful-favoritos
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Logs de los contenedores
        if: failure()
        run: docker compose ps && docker compose logs

      - name: Detener contenedores
        if: always()
        run: docker compose down -v

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm audit --audit-level=moderate
